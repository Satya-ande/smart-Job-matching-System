# ==========================================
# SmartJob V2 — PostgreSQL Profile
# ==========================================
# Activate with: ./mvnw spring-boot:run -Dspring.profiles.active=postgres
# Or set environment variable: SPRING_PROFILES_ACTIVE=postgres

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartjob}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: false

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

# ==========================================
# SmartJob V2 — Application Configuration
# ==========================================

spring:
  application:
    name: SmartJob

  # ---- Database Configuration ----
  # Default: H2 in-memory database (works without PostgreSQL install)
  # To switch to PostgreSQL: use application-postgres.yml profile
  datasource:
    url: jdbc:h2:mem:smartjob;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # H2 Console (accessible at http://localhost:8080/h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console

  # ---- JPA / Hibernate Configuration ----
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # ---- Jackson JSON Configuration ----
  jackson:
    serialization:
      write-dates-as-timestamps: false

# ---- Server Configuration ----
server:
  port: 8080

# ---- JWT Configuration ----
# IMPORTANT: Override jwt.secret via environment variable in production
jwt:
  secret: ${JWT_SECRET:smartjob-v2-default-dev-secret-key-change-in-production-min-32-chars}
  expiration-ms: ${JWT_EXPIRATION:86400000}

# ---- Logging ----
logging:
  level:
    com.smartjob: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

# ---- Swagger / OpenAPI ----
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
